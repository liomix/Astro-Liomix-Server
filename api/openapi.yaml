openapi: 3.1.0
info:
  title: Astro Liomix Blog API
  version: 0.2.0
  description: >
    Comment and traffic-counting API for the blog. New comments enter moderation
    and are not part of the public listing until approved. Storage adapters are
    in-memory for now; the HTTP contract is stable.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: comments
  - name: count
    description: Site-wide traffic counters.
  - name: health

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/v1/posts/{slug}/comments:
    parameters:
      - name: slug
        in: path
        required: true
        description: Post slug, e.g. `hello-astro` or `notes/2026/hello`.
        schema:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9._/-]+$"
    get:
      tags: [comments]
      summary: List comments of a post
      operationId: listComments
      description: >
        Returns comments newest first. Only approved comments are returned
        unless another status (or `all`) is requested, so comments awaiting
        moderation never leak publicly.
      parameters:
        - name: status
          in: query
          description: Moderation filter. Defaults to `approved`.
          schema:
            type: string
            enum: [approved, pending, rejected, spam, all]
        - name: limit
          in: query
          description: Page size. Clamped to the server maximum (100 by default).
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: A page of comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      tags: [comments]
      summary: Publish a comment
      operationId: createComment
      description: >
        Validates and stores a comment. The response carries the moderation
        status, which is `pending` by default, so a 201 does not mean the
        comment is publicly visible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment stored
          headers:
            Location:
              description: URL of the created comment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/comments/{id}:
    get:
      tags: [comments]
      summary: Get a comment
      operationId: getComment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/count/site:
    get:
      tags: [count]
      summary: Read the site counters
      operationId: getSiteStats
      description: >
        Cumulative site-wide traffic since the counter started, not a daily
        figure. `visitors` counts distinct visitor IDs, so it grows slower than
        `views` and does not move for clients that report without an ID.
      responses:
        "200":
          description: The current counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/site/visits:
    post:
      tags: [count]
      summary: Record a site visit
      operationId: recordSiteVisit
      description: >
        Counts one page view and answers with the updated counters, so a single
        round-trip both records and reports. The response is 200 rather than 201
        because a visit is an increment on a counter, not an addressable
        resource: there is no Location to return and nothing to fetch later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVisitRequest"
      responses:
        "200":
          description: Visit counted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/posts:
    get:
      tags: [count]
      summary: Read post view counts in bulk
      operationId: listPostViews
      description: >
        A listing page asks once for every card it renders instead of one request
        per card. Counts are cumulative page views of the article, not unique
        readers. A slug that was never read reports zero rather than being
        omitted, so the caller can render a placeholder without special cases.
      parameters:
        - name: slugs
          in: query
          required: true
          description: Comma-separated post slugs, at most 100.
          schema:
            type: string
          example: hello-astro,notes/2026/hello
      responses:
        "200":
          description: One entry per requested slug, in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViewsList"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/posts/views:
    post:
      tags: [count]
      summary: Record a post read
      operationId: recordPostView
      description: >
        Adds one read to the post and returns its new total. The slug travels in
        the body because a nested slug ("notes/2026/hello") contains "/" and a
        path wildcard cannot span segments. Returns 200 for the same reason as
        the site visit endpoint: an increment is not an addressable resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPostViewRequest"
      responses:
        "200":
          description: Read counted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViews"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  responses:
    InvalidInput:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No resource matches the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: A dependency could not serve the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [invalid_argument, not_found, conflict, internal]
        message:
          type: string
        field:
          type: string
          description: Offending field, present for validation failures.
        requestId:
          type: string
          description: Correlation ID, also returned in the X-Request-Id header.

    CommentAuthorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 254
          description: Never returned by the API; used for moderation and notifications.
        website:
          type: string
          maxLength: 200
          pattern: "^https?://"

    CommentAuthor:
      type: object
      required: [name]
      properties:
        name:
          type: string
        website:
          type: string

    CreateCommentRequest:
      type: object
      required: [author, body]
      additionalProperties: false
      properties:
        parentId:
          type: string
          description: ID of the comment being replied to; must belong to the same post.
        author:
          $ref: "#/components/schemas/CommentAuthorInput"
        body:
          type: string
          minLength: 1
          maxLength: 2000

    Comment:
      type: object
      required: [id, postSlug, author, body, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        postSlug:
          type: string
        parentId:
          type: string
        author:
          $ref: "#/components/schemas/CommentAuthor"
        body:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, spam]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CommentList:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pagination:
          type: object
          required: [limit, offset, count]
          properties:
            limit:
              type: integer
            offset:
              type: integer
            count:
              type: integer

    RecordVisitRequest:
      type: object
      additionalProperties: false
      description: >
        The body may be an empty object when the client has no visitor
        identifier; the view is still counted.
      properties:
        visitorId:
          type: string
          maxLength: 128
          description: >
            Opaque per-browser identifier minted by the client and reused across
            page loads. The server never parses it, never returns it, and uses it
            only to deduplicate the visitor total.

    SiteStats:
      type: object
      required: [views, visitors]
      properties:
        views:
          type: integer
          format: int64
          description: Total recorded page views.
        visitors:
          type: integer
          format: int64
          description: Distinct visitor IDs seen.
        updatedAt:
          type: string
          format: date-time
          description: Time of the last recorded visit. Absent while the counter is empty.

    RecordPostViewRequest:
      type: object
      required: [slug]
      additionalProperties: false
      properties:
        slug:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9._/-]+$"
          description: Post identifier, the same one the comment API uses.

    PostViews:
      type: object
      required: [slug, views]
      properties:
        slug:
          type: string
        views:
          type: integer
          format: int64
          description: Cumulative reads of the post.

    PostViewsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostViews"
