openapi: 3.1.0
info:
  title: Astro Liomix Blog API
  version: 0.7.1
  description: >
    Comment and traffic-counting API for the blog. New comments enter moderation
    and are not part of the public listing until approved.


    Errors are RFC 9457 problem documents (`application/problem+json`) with a
    stable `code` for clients to branch on. Listings page with an opaque cursor
    instead of an offset, and every response states its caching policy.
servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: comments
  - name: count
    description: Site-wide traffic counters.
  - name: health
  - name: admin
    description: >
      Administrator console: accounts, sign-in sessions and the audit trail.
      Everything except sign-in requires a session token from
      POST /api/v1/admin/auth/login.

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Process is alive
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/v1/posts/{slug}/comments:
    parameters:
      - name: slug
        in: path
        required: true
        description: Post slug, e.g. `hello-astro` or `notes/2026/hello`.
        schema:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9._/-]+$"
    get:
      tags: [comments]
      summary: List comments of a post
      operationId: listComments
      description: >
        Returns one page of comments, newest first, ordered by `(createdAt, id)`
        so the order is total and a page boundary can never repeat or skip a
        row.


        Only approved comments are returned by default. Asking for any other
        moderation state — or `all` — requires an administrator credential,
        because the moderation queue is not public; without one the request is
        answered with 401 rather than an empty page that would read as "nothing
        to review".


        Public pages are cacheable and revalidated with `ETag`; a credentialled
        page is `no-store`.
      security:
        - {}
        - adminToken: []
        - adminSession: []
      parameters:
        - name: status
          in: query
          description: >
            Moderation filter. Defaults to `approved`. Any other value requires
            an administrator credential.
          schema:
            type: string
            enum: [approved, pending, rejected, spam, all]
        - name: limit
          in: query
          description: Page size. Values above the server maximum are clamped to it.
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: >
            Opaque token from the previous page's `nextCursor`. Omit it for the
            newest page. The token names the last row of the previous page, so
            comments posted in between do not shift what comes next — unlike an
            offset, which would repeat or skip rows as the thread grows.
          schema:
            type: string
      responses:
        "200":
          description: A page of comments
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cacheable"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPage"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      tags: [comments]
      summary: Publish a comment
      operationId: createComment
      description: >
        Validates and stores a comment. The response carries the moderation
        status, which is `pending` by default, so a 201 does not mean the
        comment is publicly visible.


        Send `Idempotency-Key` to make a retry safe. The client generates one
        string per submission and reuses it for every retry of that submission:
        the first retry after a lost response replays the stored 201 instead of
        creating a second comment. The same key with a different body is
        answered with 409, because that is a client bug rather than a retry.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Client-generated key, 8–200 characters, unique per submission and
            stable across retries of that submission. Optional; without it every
            retry creates a new comment.
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment stored (or replayed from an idempotent retry)
          headers:
            Location:
              description: URL of the created comment.
              schema:
                type: string
            Idempotency-Replayed:
              description: >
                `true` when this response is a replay of an earlier request with
                the same Idempotency-Key; absent otherwise.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedComment"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/comments/counts:
    get:
      tags: [comments]
      summary: Count comments per post
      operationId: countComments
      description: >
        Answers how many approved comments each requested post has, so a page of
        cards can show the number without loading every thread. Posts nobody has
        commented on are answered with a count of zero instead of a 404: the
        question is "how many", and the answer is zero.
      parameters:
        - name: slugs
          in: query
          required: true
          description: >
            Comma-separated post slugs. Blanks and duplicates are dropped, the
            caller's order is preserved, and one batch is limited to 100 slugs.
          schema:
            type: string
      responses:
        "200":
          description: One entry per requested post, in request order
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cacheable"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCountList"
        "304":
          $ref: "#/components/responses/NotModified"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/comments/{id}:
    get:
      tags: [comments]
      summary: Get a comment
      operationId: getComment
      description: >
        A comment that is not approved is reported as 404 unless the request
        carries an administrator credential: guessing an ID must not expose
        content that is still awaiting moderation. That credentialled response is `no-store`.
      security:
        - {}
        - adminToken: []
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The comment
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cacheable"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "304":
          $ref: "#/components/responses/NotModified"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [comments]
      summary: Delete a comment and its replies
      operationId: deleteComment
      description: >
        Removes the comment together with every reply beneath it, at any depth.
        Replies go with the parent so a thread never keeps orphaned answers that
        would read as if they were top-level remarks.


        Two credentials are accepted. An administrator credential deletes
        anything. The
        `deleteToken` returned by POST deletes only the comment it was issued
        for — that is how a reader takes back something they wrote, without an
        account. A comment created without a token (imported data) can only be
        deleted with the admin token.


        Deleting an already-deleted comment answers 404: the absence is the
        state the caller wanted, so a client treating this as failure would lie
        to the user about a comment that is already gone.
      security:
        - adminToken: []
        - adminSession: []
        - commentAuthorToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted, with every reply beneath it
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/comments/{id}/status:
    patch:
      tags: [comments]
      summary: Change a comment's moderation state
      operationId: updateCommentStatus
      description: >
        New comments arrive as `pending` and are invisible to readers until this
        endpoint moves them to `approved`. `rejected` and `spam` stay hidden like
        `pending`; the difference is only what the moderator meant by it.
      security:
        - adminToken: []
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentStatusRequest"
      responses:
        "200":
          description: The comment with its new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/count/site:
    get:
      tags: [count]
      summary: Read the site counters
      operationId: getSiteStats
      description: >
        Cumulative site-wide traffic since the counter started, not a daily
        figure. `visitors` counts distinct visitor IDs, so it grows slower than
        `views` and does not move for clients that report without an ID.
      responses:
        "200":
          description: The current counters
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cacheable"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
        "304":
          $ref: "#/components/responses/NotModified"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/site/visits:
    post:
      tags: [count]
      summary: Record a site visit
      operationId: recordSiteVisit
      description: >
        Counts one page view and answers with the updated counters, so a single
        round-trip both records and reports. The response is 200 rather than 201
        because a visit is an increment on a counter, not an addressable
        resource: there is no Location to return and nothing to fetch later.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordVisitRequest"
      responses:
        "200":
          description: Visit counted
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/posts:
    get:
      tags: [count]
      summary: Read post view counts in bulk
      operationId: listPostViews
      description: >
        A listing page asks once for every card it renders instead of one request
        per card. Counts are cumulative page views of the article, not unique
        readers. A slug that was never read reports zero rather than being
        omitted, so the caller can render a placeholder without special cases.
      parameters:
        - name: slugs
          in: query
          required: true
          description: Comma-separated post slugs, at most 100.
          schema:
            type: string
          example: hello-astro,notes/2026/hello
      responses:
        "200":
          description: One entry per requested slug, in request order
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cacheable"
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViewsList"
        "304":
          $ref: "#/components/responses/NotModified"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/count/posts/views:
    post:
      tags: [count]
      summary: Record a post read
      operationId: recordPostView
      description: >
        Adds one read to the post and returns its new total. The slug travels in
        the body because a nested slug ("notes/2026/hello") contains "/" and a
        path wildcard cannot span segments. Returns 200 for the same reason as
        the site visit endpoint: an increment is not an addressable resource.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordPostViewRequest"
      responses:
        "200":
          description: Read counted
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostViews"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/admin/auth/login:
    post:
      tags: [admin]
      summary: Sign in as an administrator
      operationId: adminLogin
      description: >
        Exchanges a username and password for an opaque session token. The
        token is shown once; the server keeps only its SHA-256 digest, which is
        what makes sign-out and disabling an account take effect on the next
        request instead of whenever a self-contained token expires.


        The response is 200, not 201: a session is a credential, and there is
        no useful Location to hand back.


        Every failure is the same 401 with no detail — unknown account, wrong
        password, disabled account. Distinguishing them would let anyone
        enumerate valid usernames.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Signed in; the token is in the body and nowhere else
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"

  /api/v1/admin/auth/logout:
    post:
      tags: [admin]
      summary: Sign out of the current session
      operationId: adminLogout
      description: >
        Revokes the session that made the request. Other sessions of the same
        account stay valid — signing out of a phone must not sign out a laptop.
        Revoking twice answers 404: the second call changed nothing.
      security:
        - adminSession: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/auth/session:
    get:
      tags: [admin]
      summary: Read the current session
      operationId: adminCurrentSession
      description: >
        Answers who the token belongs to and when it expires, so a console can
        show the operator's name without a second endpoint and can refresh
        itself before the expiry rather than after a surprise 401.
      security:
        - adminSession: []
      responses:
        "200":
          description: The account and the session that made the request
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCurrentSession"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/admin/accounts:
    get:
      tags: [admin]
      summary: List administrator accounts
      operationId: adminListAccounts
      description: >
        One page of accounts, newest first, ordered by `(createdAt, id)` so the
        order is total and a cursor can continue it without repeating or
        skipping a row.
      security:
        - adminSession: []
      parameters:
        - name: status
          in: query
          description: Filter on one account state. Omit to list every state.
          schema:
            type: string
            enum: [active, disabled]
        - name: limit
          in: query
          description: Page size. Values above the server maximum are clamped to it.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque token from the previous page's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: A page of accounts
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"
    post:
      tags: [admin]
      summary: Create an administrator account
      operationId: adminCreateAccount
      description: >
        New accounts start active and may sign in immediately. The username is
        folded to lowercase and must be unique; a duplicate is a 409 rather
        than a 422, because the value is well-formed and the state is what
        collides.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCreateAccountRequest"
      responses:
        "201":
          description: Account created
          headers:
            Location:
              description: URL of the created account.
              schema:
                type: string
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/StateConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/admin/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [admin]
      summary: Read one account
      operationId: adminGetAccount
      security:
        - adminSession: []
      responses:
        "200":
          description: The account
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [admin]
      summary: Update a display name or an account status
      operationId: adminUpdateAccount
      description: >
        Both fields are optional; omitted means unchanged. Disabling the account
        making the request, or the last active administrator, is refused with
        409 — either would lock the operator out of the console.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateAccountRequest"
      responses:
        "200":
          description: The account as stored
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"
    delete:
      tags: [admin]
      summary: Delete an account
      operationId: adminDeleteAccount
      description: >
        Removes the account and every session it opened. Deleting oneself, or
        the last account, is refused: either would leave nobody able to sign in
        and no way back except a restart with the bootstrap variables set.
      security:
        - adminSession: []
      responses:
        "204":
          description: Account deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"

  /api/v1/admin/accounts/{id}/password:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [admin]
      summary: Change or reset a password
      operationId: adminChangePassword
      description: >
        Changing one's own password requires `currentPassword`, so a stolen
        session cannot lock the owner out. An administrator resetting someone
        else's does not: the audit trail records who did it.


        Every session of the target is revoked afterwards, including the caller's
        when they changed their own. A password change is the moment to assume
        the old credential leaked, so the next request is a 401 and the client
        signs in again.
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminChangePasswordRequest"
      responses:
        "204":
          description: Password changed; sessions revoked
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMedia"
        "422":
          $ref: "#/components/responses/InvalidInput"

  /api/v1/admin/accounts/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [admin]
      summary: List an account's live sessions
      operationId: adminListSessions
      description: >
        Live sessions only, newest first, capped at 100. No cursor: a person has
        a handful of sessions, and paging a set that never grows large would be
        machinery for nothing.
      security:
        - adminSession: []
      responses:
        "200":
          description: The live sessions
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/accounts/{id}/sessions/{sessionId}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [admin]
      summary: Revoke one session
      operationId: adminRevokeSession
      description: >
        A session that belongs to another account is reported as 404 rather than
        403: the ID is random, and confirming it exists would turn a guess into
        an oracle.
      security:
        - adminSession: []
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/admin/audit-logs:
    get:
      tags: [admin]
      summary: Read the operator audit trail
      operationId: adminListAuditLogs
      description: >
        Append-only record of privileged actions, newest first, cursor-paginated
        like every other listing. Filters are exact matches; the trail has no
        time-range filter because a cursor already makes reading backwards
        cheap.


        The route exists only when the deployment exposes a reader; a server that
        keeps a trail but does not serve it answers 404, not an empty page.
      security:
        - adminSession: []
      parameters:
        - name: action
          in: query
          description: >
            Exact action name, e.g. `auth.login`, `account.create`,
            `comment.moderate`.
          schema:
            type: string
        - name: actorId
          in: query
          description: Account ID to filter on. Anonymous actions have no ID.
          schema:
            type: string
        - name: limit
          in: query
          description: Page size. Values above the server maximum are clamped to it.
          schema:
            type: integer
            minimum: 0
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque token from the previous page's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: A page of the trail
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/MalformedRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/InvalidInput"

components:
  securitySchemes:
    adminToken:
      type: http
      scheme: bearer
      description: >
        Legacy shared secret from ADMIN_TOKEN. It moderates comments, reads the
        unapproved queue, and deletes anything. The admin module's session token
        (`adminSession`) is the normal credential; this one survives as an
        emergency way in when the account table is the problem, and is checked
        first, in constant time. When neither is configured the moderation route
        is not mounted at all and answers 404.
    commentAuthorToken:
      type: http
      scheme: bearer
      description: >
        The `deleteToken` returned once by POST /api/v1/posts/{slug}/comments.
        Scoped to that one comment: it cannot read, moderate or delete anything
        else. Never returned by a read, so it is lost if the client does not
        keep it.

    adminSession:
      type: http
      scheme: bearer
      description: >
        Opaque session token returned once by POST /api/v1/admin/auth/login,
        prefixed `adm_`. The server stores only its SHA-256 digest, so signing
        out or disabling the account invalidates it on the next request. Send it
        as `Authorization: Bearer <token>`.

  headers:
    Cacheable:
      description: >
        Public, but always revalidated. Paired with an ETag, so a repeat request
        costs a conditional 304 rather than a full body.
      schema:
        type: string
        const: public, max-age=0, must-revalidate
    NoStore:
      description: Must not be stored anywhere — the response reflects a mutation or a credential.
      schema:
        type: string
        const: no-store
    ETag:
      description: Weak validator of the exact response body; send it back as If-None-Match.
      schema:
        type: string

  responses:
    MalformedRequest:
      description: >
        The request body could not be read: broken JSON, an empty body where one
        is required, a cursor this API never issued, or two JSON values.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidInput:
      description: >
        The request parsed but violates the contract. Every failing field is
        listed, so a form can be corrected in one round trip.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: >
        No resource matches the request, or its existence is deliberately not
        revealed (an unapproved comment read without a credential).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >
        The request collides with current state: an idempotency key reused with
        a different body, or a first request still running under that key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    StateConflict:
      description: >
        The request collides with current state: a duplicate username, or a
        change that would leave the console unusable (disabling or deleting the
        account making the request, disabling the last active administrator, or
        deleting the last account).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A dependency could not serve the request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: >
        The request did not present a usable credential, or presented one that
        does not match. A 401 always carries a Bearer challenge naming the
        scheme the client should use.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Always a Bearer challenge.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds the endpoint's limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMedia:
      description: The request body is not declared as application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotModified:
      description: The stored copy is still current; no body is returned.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
        Cache-Control:
          $ref: "#/components/headers/Cacheable"

  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem document. Clients branch on `code` and never on
        `title` or `detail`, which are written for the developer reading the
        response and may change wording or language.
      required: [title, status, code]
      properties:
        title:
          type: string
          description: Stable, short summary of `code`. Same code, same title.
          examples: [Request validation failed]
        status:
          type: integer
          description: Repeats the HTTP status so a rewritten status line cannot change the meaning.
          examples: [422]
        code:
          type: string
          description: >
            Machine-readable identifier. Stable once published and never reused
            for a different failure.
          examples: [VALIDATION_FAILED, MALFORMED_REQUEST, RESOURCE_NOT_FOUND]
        detail:
          type: string
          description: >
            Optional sentence about this occurrence, written by the server. It
            is present only where the response was written for it; a wrapped
            database error never becomes a detail, so it can be shown to a user
            when the contract says so.
        instance:
          type: string
          description: Request path that produced the problem.
          examples: [/api/v1/posts/hello-astro/comments]
        traceId:
          type: string
          description: Matches the X-Request-Id response header and the server log line.
        errors:
          type: array
          description: Every field that failed validation, not just the first.
          items:
            $ref: "#/components/schemas/FieldProblem"

    FieldProblem:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: >
            Path into the request body (author.email, items[0].quantity) so the
            client can attach the message to the right input.
          examples: [author.email]
        code:
          type: string
          description: Why this field was rejected.
          examples: [REQUIRED, TOO_LONG, INVALID_FORMAT, OUT_OF_RANGE]
        message:
          type: string
          description: Human-readable explanation, developer-facing.

    CommentAuthorInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 254
          description: Never returned by the API; used for moderation and notifications.
        website:
          type: string
          maxLength: 200
          pattern: "^https?://"

    CommentAuthor:
      type: object
      required: [name, website, isOwner]
      properties:
        name:
          type: string
        website:
          type: string
          description: Empty string when the author left none.
        isOwner:
          type: boolean
          description: >-
            True when the comment was written by the site owner: an address from
            SITE_OWNER_EMAILS plus the owner key. Decided once at creation and
            stored, never recomputed from the email.

    CreateCommentRequest:
      type: object
      required: [author, body]
      description: >
        Unknown fields are ignored rather than rejected, so a client can ship a
        new optional field before the server supports it.
      properties:
        parentId:
          type: string
          description: ID of the comment being replied to; must belong to the same post.
        author:
          $ref: "#/components/schemas/CommentAuthorInput"
        body:
          type: string
          minLength: 1
          maxLength: 2000
          description: >
            Markdown source as the author wrote it — never rendered HTML.
            Inline emoji are shortcodes like `:huoying/hy-1:`, resolved by the
            reader against the same configuration that draws the picker, so a
            stored asset path cannot rot the archive. The length limit counts
            source characters, which is why markup is not an acceptable
            encoding: one image tag costs five times what its shortcode does.
        ownerKey:
          type: string
          maxLength: 200
          description: >
            The site owner's key. Only consulted when `author.email` is one of
            SITE_OWNER_EMAILS: with a key configured, a mismatched or missing
            value is rejected with a 422 naming this field, so an address alone
            cannot publish as the owner. Readers never send it.

    UpdateCommentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected, spam]
          description: Only `approved` makes a comment readable by visitors.

    Comment:
      type: object
      required: [id, postSlug, parentId, author, body, status, createdAt, updatedAt]
      properties:
        id:
          type: string
        postSlug:
          type: string
        parentId:
          type: [string, "null"]
          description: >
            Null for a top-level comment. The key is always present, so the
            client can tell "a root comment" from "a response that did not
            include the field".
        author:
          $ref: "#/components/schemas/CommentAuthor"
        body:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, spam]
          description: >
            Clients must tolerate values they do not know: a new state is a
            compatible addition, not a breaking change.
        createdAt:
          type: string
          format: date-time
          description: RFC 3339, always UTC.
        updatedAt:
          type: string
          format: date-time
          description: RFC 3339, always UTC.

    CreatedComment:
      description: >
        The stored comment plus the author's deletion credential. The token is
        shown exactly once, here and nowhere else.
      allOf:
        - $ref: "#/components/schemas/Comment"
        - type: object
          required: [deleteToken]
          properties:
            deleteToken:
              type: string
              description: >
                Bearer credential for DELETE /api/v1/comments/{id}. Store it on
                the client; the server keeps only its digest.

    CommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        nextCursor:
          type: [string, "null"]
          description: >
            Token for the next page, or null when this is the last one. Pass it
            back as `cursor`. Do not build one by hand: the ordering key is the
            server's business.

    CommentCountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [slug, count]
            properties:
              slug:
                type: string
              count:
                type: integer
                minimum: 0
                description: Approved comments only.

    RecordVisitRequest:
      type: object
      description: >
        The body may be an empty object when the client has no visitor
        identifier; the view is still counted.
      properties:
        visitorId:
          type: string
          maxLength: 128
          description: >
            Opaque per-browser identifier minted by the client and reused across
            page loads. The server never parses it, never returns it, and uses it
            only to deduplicate the visitor total.

    SiteStats:
      type: object
      required: [views, visitors]
      properties:
        views:
          type: integer
          format: int64
          description: Total recorded page views.
        visitors:
          type: integer
          format: int64
          description: Distinct visitor IDs seen.
        updatedAt:
          type: string
          format: date-time
          description: Time of the last recorded visit. Absent while the counter is empty.

    RecordPostViewRequest:
      type: object
      required: [slug]
      properties:
        slug:
          type: string
          maxLength: 200
          pattern: "^[A-Za-z0-9._/-]+$"
          description: Post identifier, the same one the comment API uses.

    PostViews:
      type: object
      required: [slug, views]
      properties:
        slug:
          type: string
        views:
          type: integer
          format: int64
          description: Cumulative reads of the post.

    PostViewsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostViews"

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Case-insensitive; stored folded to lowercase.
        password:
          type: string
          format: password
          writeOnly: true

    AdminLoginResponse:
      type: object
      required: [token, expiresAt, account]
      properties:
        token:
          type: string
          description: >
            The session token, shown exactly once. Store it where the client
            keeps credentials and send it as a Bearer token.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry. Sessions do not slide.
        account:
          $ref: "#/components/schemas/AdminAccount"

    AdminAccount:
      type: object
      required: [id, username, displayName, status, passwordIsInitial, createdAt, updatedAt, lastLoginAt]
      properties:
        id:
          type: string
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9._-]{2,39}$"
          description: Lowercase, unique, and the value used to sign in.
        displayName:
          type: string
          maxLength: 80
          description: What the console shows. Carries the capitalisation usernames do not.
        status:
          type: string
          enum: [active, disabled]
          description: A disabled account cannot sign in and its live sessions stop authenticating.
        passwordIsInitial:
          type: boolean
          description: >
            True while the account still uses the password it was created with,
            or the one an administrator reset it to. Clients should nudge the
            operator to change it; the console shows a standing reminder.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: [string, "null"]
          format: date-time
          description: >
            Null for an account that has never signed in. That is different from
            a timestamp: it means the credential has never been used.

    AdminAccountPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        nextCursor:
          type: [string, "null"]
          description: Null on the last page.

    AdminCreateAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[a-z0-9][a-z0-9._-]{2,39}$"
        displayName:
          type: string
          maxLength: 80
          description: Defaults to the username when omitted.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 200
          description: >
            Twelve characters is the floor. The value must not equal the
            username and must not contain control characters.

    AdminUpdateAccountRequest:
      type: object
      description: At least one field must be present; omitted fields are unchanged.
      properties:
        displayName:
          type: string
          maxLength: 80
        status:
          type: string
          enum: [active, disabled]

    AdminChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          writeOnly: true
          description: Required when the caller is changing their own password.
        newPassword:
          type: string
          format: password
          writeOnly: true
          minLength: 12
          maxLength: 200

    AdminSession:
      type: object
      required: [id, createdAt, lastSeenAt, expiresAt, ip, userAgent, current]
      properties:
        id:
          type: string
        createdAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
          description: Updated at most once every five minutes, not on every request.
        expiresAt:
          type: string
          format: date-time
        ip:
          type: string
          description: The connection address. Proxy headers are not trusted.
        userAgent:
          type: string
        current:
          type: boolean
          description: True for the session that authenticated this request.

    AdminCurrentSession:
      type: object
      required: [account, session]
      properties:
        account:
          $ref: "#/components/schemas/AdminAccount"
        session:
          $ref: "#/components/schemas/AdminSession"

    AdminSessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminSession"

    AuditLogEntry:
      type: object
      required: [id, actorId, actorName, action, resource, resourceId, detail, ip, userAgent, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: string
          description: Empty for actions no account performed, e.g. the initial bootstrap.
        actorName:
          type: string
          description: Username at the time of the action, snapshotted so the row survives a rename or deletion.
        action:
          type: string
          description: Dotted and stable, e.g. auth.login or comment.moderate.
        resource:
          type: string
        resourceId:
          type: string
        detail:
          type: object
          additionalProperties: true
          description: Action-specific context. Never contains secrets.
        ip:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        nextCursor:
          type: [string, "null"]
          description: Null on the last page.
