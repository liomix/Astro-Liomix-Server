{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Liomix 控制台</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #1b1f24;
    --muted: #6b7480;
    --line: #e3e7ec;
    --accent: #2f6feb;
    --danger: #c0392b;
    --ok: #1e7a46;
    --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 0 24px; height: 52px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 2;
  }
  header.top nav { display: flex; gap: 4px; }
  header.top nav a {
    padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 500;
  }
  header.top nav a.on { background: #eef3ff; color: var(--accent); }
  header.top nav a:hover { background: #f0f2f5; text-decoration: none; }
  .who { display: flex; align-items: center; gap: 10px; color: var(--muted); }
  .who form { margin: 0; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  .login { max-width: 360px; margin: 12vh auto; }
  .login h1 { text-align: center; }
  label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 13px; }
  label input {
    display: block; width: 100%; margin-top: 5px; padding: 8px 10px;
    border: 1px solid var(--line); border-radius: 6px; font: inherit; color: var(--ink);
    background: #fff;
  }
  label input:focus { outline: 2px solid #cfe0ff; border-color: var(--accent); }
  button {
    font: inherit; padding: 7px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button:hover { background: #f3f5f8; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #255bc4; }
  button.link { border: 0; background: none; padding: 0; color: var(--muted); }
  button.link:hover { text-decoration: underline; background: none; }
  button.danger { color: var(--danger); border-color: #f0cfcb; }
  .err, .ok {
    padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 13px;
  }
  .err { background: #fdecea; color: var(--danger); border: 1px solid #f5c6c0; }
  .ok { background: #e8f5ee; color: var(--ok); border: 1px solid #bfe3cd; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: #fafbfc; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--muted); font-size: 12px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  pre.body {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font: inherit; max-width: 380px; max-height: 140px; overflow: auto;
  }
  .nowrap { white-space: nowrap; font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; }
  .pill.pending { background: #fff4d6; color: var(--warn); }
  .pill.approved, .pill.active { background: #e8f5ee; color: var(--ok); }
  .pill.rejected, .pill.spam, .pill.disabled { background: #f1f2f4; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .actions form { margin: 0; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs a { padding: 5px 12px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--muted); }
  .tabs a.on { border-color: var(--accent); color: var(--accent); background: #eef3ff; }
  .tabs a:hover { text-decoration: none; background: #f3f5f8; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .row label { margin-bottom: 0; flex: 1 1 160px; }
  .pager { margin-top: 14px; }
</style>
</head>
<body>
{{if .Account}}
<header class="top">
  <nav>
    {{if .HasModeration}}<a href="/admin/comments" {{if eq .Nav "comments"}}class="on"{{end}}>评论</a>{{end}}
    <a href="/admin/accounts" {{if eq .Nav "accounts"}}class="on"{{end}}>账号</a>
    <a href="/admin/audit" {{if eq .Nav "audit"}}class="on"{{end}}>审计</a>
  </nav>
  <div class="who">
    <span>{{.Account.DisplayName}}</span>
    <form method="post" action="/admin/logout">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <button class="link" type="submit">退出</button>
    </form>
  </div>
</header>
{{end}}
<main>
  {{if .Error}}<div class="err">{{.Error}}</div>{{end}}
  {{if .Flash}}<div class="ok">{{.Flash}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>{{end}}
