{{define "content"}}
<div class="auth__card">
  <div class="auth__head">
    <span class="auth__mark">{{template "iconShield"}}</span>
    <h1 class="auth__title">管理员登录</h1>
    <p class="auth__sub">只有站点所有者可以进入</p>
  </div>
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{.CSRFToken}}">
    <div class="field mb-3">
      <label class="field__label" for="login-username">用户名</label>
      <input class="input" id="login-username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field mb-4">
      <label class="field__label" for="login-password">密码</label>
      <input class="input" id="login-password" type="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn--primary btn--block" type="submit">登录</button>
  </form>
</div>
{{end}}
